name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/

      - name: Type check with mypy
        run: mypy src/

      - name: Run tests
        run: pytest

  frontend-detect:
    name: Detect frontend
    runs-on: ubuntu-latest
    outputs:
      has_frontend: ${{ steps.check.outputs.has_frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for frontend package.json
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-tests:
    name: Vitest (frontend tests)
    needs: frontend-detect
    if: needs.frontend-detect.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

  docker-build:
    name: Docker image build validation
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: v2hub-panel:ci-validation
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  monitoring-config:
    name: Monitoring configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate disabled profile
        env:
          MONITORING_PROFILE: disabled
          COMPOSE_PROFILES: disabled
        run: |
          services="$(docker compose config --services)"

          echo "$services"

          for service in alloy loki prometheus grafana; do
            if echo "$services" | grep -qx "$service"; then
              echo "ERROR: $service should not be included when monitoring is disabled."
              exit 1
            fi
          done

      - name: Validate enabled profile
        env:
          MONITORING_PROFILE: enabled
          COMPOSE_PROFILES: enabled
        run: |
          services="$(docker compose config --services)"

          echo "$services"

          for service in alloy loki prometheus grafana; do
            if ! echo "$services" | grep -qx "$service"; then
              echo "ERROR: $service should be included when monitoring is enabled."
              exit 1
            fi
          done

      - name: Validate Nginx routing - enabled
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            --env MONITORING_PROFILE=enabled \
            -v "$PWD/nginx/entrypoint/grafana-config.sh:/tmp/grafana-config.sh:ro" \
            nginx:1.25-alpine \
            -c 'mkdir -p /etc/nginx/snippets && cp /tmp/grafana-config.sh /tmp/test.sh && chmod +x /tmp/test.sh && /tmp/test.sh && grep -q "proxy_pass http://grafana:3000;" /etc/nginx/snippets/grafana.conf'

      - name: Validate Nginx routing - disabled
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            --env MONITORING_PROFILE=disabled \
            -v "$PWD/nginx/entrypoint/grafana-config.sh:/tmp/grafana-config.sh:ro" \
            nginx:1.25-alpine \
            -c 'mkdir -p /etc/nginx/snippets && cp /tmp/grafana-config.sh /tmp/test.sh && chmod +x /tmp/test.sh && /tmp/test.sh && grep -q "return 404;" /etc/nginx/snippets/grafana.conf'

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend-detect
      - frontend-tests
      - docker-build
      - monitoring-config
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs were cancelled."
            exit 1
          fi
          echo "All required jobs passed."